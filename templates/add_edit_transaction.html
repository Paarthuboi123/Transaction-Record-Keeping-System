{% extends 'base.html' %}
{% block content %}
<h2>{{ action }} Transaction</h2>
<form method="post" class="transaction-form">
  <label>Date<br><input name="date" type="date" value="{{ tx['date'] if tx else '' }}"></label><br>
  <label>Buyer / Source<br><input name="counterparty" value="{{ tx['counterparty'] if tx else '' }}"></label><br>
  <label>Item<br><input name="item" value="{{ tx['item'] if tx else '' }}"></label><br>
  <label>Type<br>
    <select name="transaction_type">
      <option value="sale" {% if tx and tx['transaction_type'] == 'sale' %}selected{% endif %}>Sale</option>
      <option value="purchase" {% if tx and tx['transaction_type'] == 'purchase' %}selected{% endif %}>Purchase</option>
      <option value="other" {% if tx and tx['transaction_type'] == 'other' %}selected{% endif %}>Other</option>
    </select>
  </label><br>
  <label>Amount<br><input name="amount" type="number" min="1" step="0.01" value="{{ tx['amount'] if tx else '' }}"></label><br>
  <label>Description<br><textarea name="description">{{ tx['description'] if tx else '' }}</textarea></label><br>
  <button type="submit">{{ action }}</button>
</form>
{% endblock %}
