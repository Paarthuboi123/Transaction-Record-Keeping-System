{% extends 'base.html' %}
{% block content %}
<div class="login-shell">
  <div class="login-hero">
    <p class="eyebrow">Secure operations portal</p>
    <h1>Welcome to DG Events</h1>
    <p>Manage transactions, produce daily reports, and keep your records organised from a polished, professional workspace.</p>
  </div>
  <div class="auth-card">
    <p class="auth-subtitle">Sign in to continue</p>
    <form method="post" class="auth-form">
      <label>
        Username
        <input name="username" required autocomplete="username">
      </label>
      <label>
        Password
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit">Login</button>
    </form>
  </div>
</div>
{% endblock %}
